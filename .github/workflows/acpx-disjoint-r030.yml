name: ACPX R050 published CLI and full compatibility qualification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acpx-upstream-shipped-r050
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout public conformance lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup pinned Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          check-latest: false

      - name: Install pinned package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts --no-audit --no-fund pnpm@11.27.1
          test "$(pnpm --version)" = "11.27.1"

      - name: Fetch exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --no-checkout https://github.com/openclaw/acpx.git upstream
          git -C upstream fetch --quiet --depth=1 origin 48c1615057ae43893f80868f81cd3ee0445eb0ae
          git -C upstream checkout --quiet --detach 48c1615057ae43893f80868f81cd3ee0445eb0ae
          test "$(git -C upstream rev-parse HEAD)" = "48c1615057ae43893f80868f81cd3ee0445eb0ae"
          test -z "$(git -C upstream status --porcelain)"

      - name: Verify complete source and test identities
        shell: bash
        run: |
          set -euo pipefail
          echo '31D4D280E9702F5C3710B44C168093C74ADF886063B44769CDC57A3A22C911C4  patches/acpx-cli-model-intent-r030.patch' | sha256sum -c -
          echo '20FF8DDEB76AC4D52DF568367E2C838AFB37FEC4866C13E3C7EEEB1776FB97E6  patches/acpx-cli-owner-capability-r033.patch' | sha256sum -c -
          echo '578CF126905E71BFA2B9EB8E3967E768AD9AC8AC02F91E04EFFA7D79B12DA243  harness/acpx/upstream-r036/cli-config-model-intent.test.ts' | sha256sum -c -
          echo 'A976096E70870B2FAE3B3F095EA4EF02A5D5E2183C267117539E75568A048A89  harness/acpx/upstream-r036/cli-config-opaque-value.test.ts' | sha256sum -c -
          echo 'D15463AFBF6B34C802D760E07B8D6F05A0F7C2E35DD28B1A5C52639EE28C2BEE  harness/acpx/upstream-r036/queue-cli-owner-capability.test.ts' | sha256sum -c -
          echo '3E313386E8FCD67D015DB887E977071BA3ADA76BED7889BF675233E9E53EC2F3  harness/acpx/upstream-r038/queue-cli-stale-owner.test.ts' | sha256sum -c -
          echo '6CA2BD589712F6BF6C69A61C01B8F868A0DCD1A7FBAFEEC76C867B2C2B3311B5  patches/acpx-cli-stale-owner-r038.patch' | sha256sum -c -
          echo '06F74A5A0E22714DF201E3EFD463A711C01ECE23586D9480946BE9202F03068C  patches/acpx-cli-owner-compatible-r042.patch' | sha256sum -c -

      - name: Install frozen upstream dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream install --frozen-lockfile --ignore-scripts

      - name: Apply reviewed production patches and portable tests
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../patches/acpx-cli-model-intent-r030.patch
          git -C upstream apply ../patches/acpx-cli-model-intent-r030.patch
          git -C upstream apply --check ../patches/acpx-cli-owner-capability-r033.patch
          git -C upstream apply ../patches/acpx-cli-owner-capability-r033.patch
          test "$(git -C upstream diff --name-only | wc -l)" -eq 14
          git -C upstream diff --check
          cp harness/acpx/upstream-r036/*.test.ts upstream/test/
          cp harness/acpx/upstream-r038/queue-cli-stale-owner.test.ts upstream/test/
          test "$(git -C upstream ls-files --others --exclude-standard | wc -l)" -eq 4
          mkdir -p evidence

      - name: Compile public candidate and portable tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream run build
          pnpm -C upstream run build:test
          test -s upstream/dist-test/test/cli-config-model-intent.test.js
          test -s upstream/dist-test/test/cli-config-opaque-value.test.js
          test -s upstream/dist-test/test/queue-cli-owner-capability.test.js
          test -s upstream/dist-test/test/queue-cli-stale-owner.test.js

      - name: Prove base candidate's stale-owner refusal is reproduced
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd upstream && node --test --test-reporter=tap dist-test/test/queue-cli-stale-owner.test.js) > evidence/acpx-r038-before.tap 2>&1
          status=$?
          set -e
          test "$status" -ne 0 || { echo "HOLD: R038 regression no longer reproduces on R033 base"; exit 1; }
          grep -Fqx '# tests 3' evidence/acpx-r038-before.tap
          grep -Fqx '# pass 1' evidence/acpx-r038-before.tap
          grep -Fqx '# fail 2' evidence/acpx-r038-before.tap
          grep -F 'Running queue owner does not support CLI config option intent' evidence/acpx-r038-before.tap
          echo "R038_BASELINE_REPRODUCED: two stale owner regression assertions failed as expected"

      - name: Apply narrowly scoped stale-owner reconciliation overlay
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../patches/acpx-cli-stale-owner-r038.patch
          git -C upstream apply ../patches/acpx-cli-stale-owner-r038.patch
          git -C upstream diff --check
          test "$(git -C upstream diff --name-only | wc -l)" -eq 14
          test "$(git -C upstream ls-files --others --exclude-standard | wc -l)" -eq 4
          pnpm -C upstream run build
          pnpm -C upstream run build:test
          test -s upstream/dist-test/test/queue-cli-stale-owner.test.js

      - name: Prove old-owner ordinary CLI refusal in previous candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd upstream && node --test --test-reporter=tap --test-name-pattern='legacy-compatible unpadded CLI control' dist-test/test/queue-cli-owner-capability.test.js) > evidence/acpx-r042-before.tap 2>&1
          status=$?
          set -e
          test "$status" -ne 0 || { echo "HOLD: previous candidate did not reproduce old-owner refusal"; exit 1; }
          grep -Fqx '# fail 1' evidence/acpx-r042-before.tap
          grep -F 'Running queue owner does not support CLI config option intent' evidence/acpx-r042-before.tap
          echo "R042_BASELINE_REPRODUCED: one legacy-compatible request failed before overlay"

      - name: Apply R042 compatibility overlay and verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../patches/acpx-cli-owner-compatible-r042.patch
          git -C upstream apply ../patches/acpx-cli-owner-compatible-r042.patch
          git -C upstream diff --check
          test "$(git -C upstream diff --name-only | wc -l)" -eq 14
          test "$(git -C upstream ls-files --others --exclude-standard | wc -l)" -eq 4
          test "$(git -C upstream hash-object src/session/queue/ipc.ts)" = "f5236c99690250c0c4b806345e7c2daa29fd5e38"
          test "$(git -C upstream hash-object test/queue-cli-owner-capability.test.ts)" = "deac74bbec5447dab30be1c3ff5dda5b7164eeed"
          pnpm -C upstream run build
          pnpm -C upstream run build:test

      - name: Run 18 focused upstream-format regression tests
        shell: bash
        run: |
          set -euo pipefail
          (cd upstream && node --test --test-reporter=tap \
            dist-test/test/cli-config-model-intent.test.js \
            dist-test/test/cli-config-opaque-value.test.js \
            dist-test/test/queue-cli-owner-capability.test.js \
            dist-test/test/queue-cli-stale-owner.test.js) > evidence/acpx-r042-tests.tap 2>&1 || { tail -n 140 evidence/acpx-r042-tests.tap; exit 1; }
          grep -Fqx '# tests 18' evidence/acpx-r042-tests.tap
          grep -Fqx '# pass 18' evidence/acpx-r042-tests.tap
          grep -Fqx '# fail 0' evidence/acpx-r042-tests.tap
          grep -Fqx '# cancelled 0' evidence/acpx-r042-tests.tap
          tail -n 22 evidence/acpx-r042-tests.tap

      - name: Complete maintained upstream checks with portable tests
        shell: bash
        run: |
          set -euo pipefail
          (cd upstream && pnpm run check) > evidence/acpx-r042-upstream-check.log 2>&1 || { tail -n 140 evidence/acpx-r042-upstream-check.log; exit 1; }
          tail -n 32 evidence/acpx-r042-upstream-check.log

      - name: Verify built CLI entrypoint is available
        shell: bash
        run: |
          set -euo pipefail
          node upstream/dist/cli.js --help > evidence/acpx-r042-cli-help.txt
          test -s evidence/acpx-r042-cli-help.txt

      - name: Verify patched source matches exact upstream PR Git tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "48c1615057ae43893f80868f81cd3ee0445eb0ae"
          git -C upstream fetch --quiet --no-tags --depth=1 https://github.com/Footloose9/acpx.git 613e95c641a623d51710b8ee7b3ad954b3ae66b4
          test "$(git -C upstream rev-parse FETCH_HEAD)" = "613e95c641a623d51710b8ee7b3ad954b3ae66b4"
          git -C upstream show FETCH_HEAD:CHANGELOG.md > upstream/CHANGELOG.md
          echo 'D475D57C59DB64CD660E4ADE805393BA39084A1E067D8227000126BF9AFA94DD  upstream/CHANGELOG.md' | sha256sum -c -
          test "$(git -C upstream hash-object CHANGELOG.md)" = "d63e33f1382024c7cbb5eb1c814ce0289eb04d2b"
          git -C upstream diff --check
          git -C upstream add -A
          git -C upstream diff --cached --check
          test -z "$(git -C upstream diff --name-only)"
          test -z "$(git -C upstream ls-files --others --exclude-standard)"
          test "$(git -C upstream write-tree)" = "6a783ebc7247a7643dc4c61a3f0a86e6b2a47b7b"
          echo "R050_SOURCE_TREE_EQUALS_UPSTREAM_PR_1038"

      - name: Verify pinned published predecessor and R050 source harness
        shell: bash
        run: |
          set -euo pipefail
          echo 'D3A94A4A1A797A87F2E499C83008E4A954ECD1F74F4CE0EC4FCB0C01ECDA0171  harness/acpx/shipped-cli-r050.cjs' | sha256sum -c -
          actual="$(npm view acpx@0.22.0 dist.integrity --json | node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(Array.isArray(v)?v[0]:v)')"
          test "$actual" = "sha512-dD+xgRwLFOfwL7/VEdn3zrVNFleFoIA0EUETK35w/e+MeYB5FN5+vKERoV60d4SUirTqX610yb/wN+2OFcjpMQ=="
          npm install --prefix oldpkg --ignore-scripts --no-audit --no-fund --no-save --package-lock=false acpx@0.22.0
          node -e 'const p=require("./oldpkg/node_modules/acpx/package.json");if(p.version!=="0.22.0")process.exit(1)'

      - name: Prove published older binary to corrected source end-to-end
        shell: bash
        run: |
          set -euo pipefail
          node harness/acpx/shipped-cli-r050.cjs upstream oldpkg/node_modules/acpx evidence/acpx-r050-shipped-cli-linux.json
          node -e 'const j=require("./evidence/acpx-r050-shipped-cli-linux.json");const a=j.scenarios.flatMap(s=>s.steps.map(x=>x.exit));if(!j.successful||j.scenarios.length!==3||j.scenarios.some(s=>!s.passed)||a.length!==24||a.filter(x=>x===1).length!==1||a.filter(x=>x===0).length!==23)process.exit(1);console.log("R050_SHIPPED_CLI_PASS: 3 scenarios, 23 ordinary successes, 1 expected defensive refusal")'
          test "$(git -C upstream write-tree)" = "6a783ebc7247a7643dc4c61a3f0a86e6b2a47b7b"
          test -z "$(git -C upstream diff --name-only)"
          test -z "$(git -C upstream ls-files --others --exclude-standard)"
          sha256sum evidence/acpx-r050-shipped-cli-linux.json

      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acpx-upstream-compatible-r042-evidence
          path: evidence/*
          if-no-files-found: warn
          retention-days: 7
