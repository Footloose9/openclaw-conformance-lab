name: ACPX upstream-format R036 qualification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acpx-upstream-format-r036
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout public conformance lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup pinned Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          check-latest: false

      - name: Install pinned package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts --no-audit --no-fund pnpm@11.27.1
          test "$(pnpm --version)" = "11.27.1"

      - name: Fetch exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --no-checkout https://github.com/openclaw/acpx.git upstream
          git -C upstream fetch --quiet --depth=1 origin 48c1615057ae43893f80868f81cd3ee0445eb0ae
          git -C upstream checkout --quiet --detach 48c1615057ae43893f80868f81cd3ee0445eb0ae
          test "$(git -C upstream rev-parse HEAD)" = "48c1615057ae43893f80868f81cd3ee0445eb0ae"
          test -z "$(git -C upstream status --porcelain)"

      - name: Verify complete source and test identities
        shell: bash
        run: |
          set -euo pipefail
          echo '31D4D280E9702F5C3710B44C168093C74ADF886063B44769CDC57A3A22C911C4  patches/acpx-cli-model-intent-r030.patch' | sha256sum -c -
          echo '20FF8DDEB76AC4D52DF568367E2C838AFB37FEC4866C13E3C7EEEB1776FB97E6  patches/acpx-cli-owner-capability-r033.patch' | sha256sum -c -
          echo '95607B5E8E2614B23D64E77EFEA00108F4F23793AB054D5F37A8AC069DF7BF0D  harness/acpx/upstream-r036/cli-config-model-intent.test.ts' | sha256sum -c -
          echo 'D7DBE75447B752C2CC76397AB51F2675D972017EFBC8D9FE9F8DC5D685E5BD09  harness/acpx/upstream-r036/cli-config-opaque-value.test.ts' | sha256sum -c -
          echo 'B479BAD3961488A601CD2B8E5E1D97DAFEDDC09764DA8F6009CA5E0264076982  harness/acpx/upstream-r036/queue-cli-owner-capability.test.ts' | sha256sum -c -

      - name: Install frozen upstream dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream install --frozen-lockfile --ignore-scripts

      - name: Apply reviewed production patches and portable tests
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check ../patches/acpx-cli-model-intent-r030.patch
          git -C upstream apply ../patches/acpx-cli-model-intent-r030.patch
          git -C upstream apply --check ../patches/acpx-cli-owner-capability-r033.patch
          git -C upstream apply ../patches/acpx-cli-owner-capability-r033.patch
          test "$(git -C upstream diff --name-only | wc -l)" -eq 14
          git -C upstream diff --check
          cp harness/acpx/upstream-r036/*.test.ts upstream/test/
          test "$(git -C upstream ls-files --others --exclude-standard | wc -l)" -eq 3
          mkdir -p evidence

      - name: Compile public candidate and portable tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream run build
          pnpm -C upstream run build:test
          test -s upstream/dist-test/test/cli-config-model-intent.test.js
          test -s upstream/dist-test/test/cli-config-opaque-value.test.js
          test -s upstream/dist-test/test/queue-cli-owner-capability.test.js

      - name: Run 14 focused upstream-format regression tests
        shell: bash
        run: |
          set -euo pipefail
          (cd upstream && node --test --test-reporter=tap \
            dist-test/test/cli-config-model-intent.test.js \
            dist-test/test/cli-config-opaque-value.test.js \
            dist-test/test/queue-cli-owner-capability.test.js) > evidence/acpx-r036-tests.tap 2>&1 || { tail -n 120 evidence/acpx-r036-tests.tap; exit 1; }
          grep -Fqx '# tests 14' evidence/acpx-r036-tests.tap
          grep -Fqx '# pass 14' evidence/acpx-r036-tests.tap
          grep -Fqx '# fail 0' evidence/acpx-r036-tests.tap
          grep -Fqx '# cancelled 0' evidence/acpx-r036-tests.tap
          tail -n 22 evidence/acpx-r036-tests.tap

      - name: Complete maintained upstream checks with portable tests
        shell: bash
        run: |
          set -euo pipefail
          (cd upstream && pnpm run check) > evidence/acpx-r036-upstream-check.log 2>&1 || { tail -n 140 evidence/acpx-r036-upstream-check.log; exit 1; }
          tail -n 32 evidence/acpx-r036-upstream-check.log

      - name: Verify built CLI entrypoint is available
        shell: bash
        run: |
          set -euo pipefail
          node upstream/dist/cli.js --help > evidence/acpx-r036-cli-help.txt
          test -s evidence/acpx-r036-cli-help.txt

      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acpx-upstream-format-r036-evidence
          path: evidence/*
          if-no-files-found: warn
          retention-days: 7
