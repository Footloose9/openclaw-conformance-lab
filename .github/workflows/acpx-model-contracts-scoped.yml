name: ACPX model-aware source contracts (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acpx-model-contracts-public-scoped
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout public conformance lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Select Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          check-latest: false

      - name: Install exact ACPX package manager without install scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts --no-audit --no-fund pnpm@11.27.1
          test "$(pnpm --version)" = "11.27.1"
          node --version

      - name: Fetch exact upstream ACPX source, no credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --no-checkout \
            https://github.com/openclaw/acpx.git upstream
          git -C upstream fetch --quiet --depth=1 origin \
            48c1615057ae43893f80868f81cd3ee0445eb0ae
          git -C upstream checkout --quiet --detach \
            48c1615057ae43893f80868f81cd3ee0445eb0ae
          test "$(git -C upstream rev-parse HEAD)" = \
            "48c1615057ae43893f80868f81cd3ee0445eb0ae"
          test -z "$(git -C upstream status --porcelain=v1)"

      - name: Insert only three synthetic tests, preserve production code
        shell: bash
        run: |
          set -euo pipefail
          echo 'CCCE4F80F6550CE3CD83CA676B87EA1618B7F710BF954F390195A724C2950D86  harness/acpx/acpx-model-control-contract.public.test.ts' |
            sha256sum -c -
          cp harness/acpx/acpx-model-control-contract.public.test.ts \
            upstream/test/acpx-model-control-contract.public.test.ts
          test "$(git -C upstream status --porcelain=v1)" = \
            "?? test/acpx-model-control-contract.public.test.ts"
          git -C upstream diff --exit-code
          echo "PASS: upstream production files unchanged"

      - name: Install upstream locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream install --frozen-lockfile --ignore-scripts \
            --reporter append-only
          git -C upstream diff --exit-code -- pnpm-lock.yaml
          test -x upstream/node_modules/.bin/tsc

      - name: Build official upstream runtime required by test imports
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream run build
          test -s upstream/dist/runtime.js

      - name: Build official Node test sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream run build:test
          test -s upstream/dist-test/test/acpx-model-control-contract.public.test.js

      - name: Run eight real-source synthetic model and queue contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/out
          (cd upstream && node --test --test-reporter=tap dist-test/test/acpx-model-control-contract.public.test.js) > harness/out/acpx-model-contracts.tap 2>&1
          cat harness/out/acpx-model-contracts.tap
          test -s harness/out/acpx-model-contracts.tap

      - name: Verify eight exact passing cases and reject false positives
        run: node harness/scripts/check-acpx-model-contracts.mjs

      - name: Preserve source-bound test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acpx-model-contracts-evidence
          path: harness/out/*
          if-no-files-found: warn
          retention-days: 7
