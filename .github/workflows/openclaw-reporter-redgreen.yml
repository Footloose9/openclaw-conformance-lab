name: OpenClaw catalog reporter baseline red, correction green (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-reporter-redgreen-proof
  cancel-in-progress: false

jobs:
  reporter-redgreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      GIT_TERMINAL_PROMPT: "0"
      OPENCLAW_LIVE_TEST: "0"
      OPENCLAW_SKIP_CHANNELS: "1"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout public lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          check-latest: false

      - name: Bootstrap verified pnpm 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pnpm12"
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 7 --max-time 80 \
            'https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.15.0.tgz' \
            -o "$RUNNER_TEMP/pnpm12/pnpm.tgz"
          actual="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/pnpm12/pnpm.tgz" | openssl base64 -A)"
          expected='yc+QlZR+9+nr29J4fRzhMoapgxTBDndq/+peyoq1XUufnQFnfbXUMFudDIKzHi545linGqmOmXfn0NoufNgcOg=='
          test "$actual" = "$expected"
          tar -xzf "$RUNNER_TEMP/pnpm12/pnpm.tgz" -C "$RUNNER_TEMP/pnpm12"
          echo "$RUNNER_TEMP/pnpm12/package" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pnpm12/package/pnpm" --version | grep -Fx '12.15.0'

      - name: Fetch pinned upstream main
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --no-checkout \
            https://github.com/openclaw/openclaw.git upstream
          git -C upstream fetch --quiet --depth=1 origin \
            d2db7b2267faf4521b3c3a08acd062edd7cbf910
          git -C upstream checkout --quiet --detach \
            d2db7b2267faf4521b3c3a08acd062edd7cbf910
          test "$(git -C upstream rev-parse HEAD)" = \
            'd2db7b2267faf4521b3c3a08acd062edd7cbf910'
          test -z "$(git -C upstream status --porcelain=v1)"

      - name: Apply regression tests only, preserve real production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo 'E316D1BE4B6F0931987B159FC4A84E9CB3CD0ABF1F1AADDA58F1239F52B00C39  patches/openclaw-catalog-retry-r018.patch' |
            sha256sum -c -
          git -C upstream apply --check \
            --include=src/agents/prepared-model-runtime.publication-events.test.ts \
            ../patches/openclaw-catalog-retry-r018.patch
          git -C upstream apply \
            --include=src/agents/prepared-model-runtime.publication-events.test.ts \
            ../patches/openclaw-catalog-retry-r018.patch
          test "$(git -C upstream diff --name-only)" = \
            'src/agents/prepared-model-runtime.publication-events.test.ts'
          git -C upstream diff --check

      - name: Install full upstream dependencies with frozen supply-chain policies
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C upstream install --frozen-lockfile \
            --ignore-scripts --reporter append-only
          git -C upstream diff --exit-code -- pnpm-lock.yaml
          test -x upstream/node_modules/.bin/tsx

      - name: Run unmodified production baseline through official agent-core Vitest
        shell: bash
        run: |
          cd upstream
          set +e
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.agents-core.config.ts \
            src/agents/prepared-model-runtime.publication-events.test.ts \
            --maxWorkers=1 --no-file-parallelism \
            --reporter=json --outputFile=../harness/out/reporter-baseline.json
          rc="$?"
          set -e
          printf 'Baseline test exit: %s\n' "$rc"
          test "$rc" -ne 0
          test -s ../harness/out/reporter-baseline.json

      - name: Apply proposed production correction without changing regression tests
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check \
            --exclude=src/agents/prepared-model-runtime.publication-events.test.ts \
            ../patches/openclaw-catalog-retry-r018.patch
          git -C upstream apply \
            --exclude=src/agents/prepared-model-runtime.publication-events.test.ts \
            ../patches/openclaw-catalog-retry-r018.patch
          git -C upstream diff --check
          test "$(git -C upstream diff --name-only | wc -l)" -eq 3

      - name: Run corrected production through same official agent-core Vitest
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.agents-core.config.ts \
            src/agents/prepared-model-runtime.publication-events.test.ts \
            --maxWorkers=1 --no-file-parallelism \
            --reporter=json --outputFile=../harness/out/reporter-corrected.json

      - name: Verify exact failing and passing case identities
        run: node harness/scripts/check-reporter-redgreen.mjs

      - name: Preserve both official test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporter-redgreen-evidence
          path: harness/out/*.json
          if-no-files-found: warn
          retention-days: 7
